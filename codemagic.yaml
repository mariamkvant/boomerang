workflows:
  ios-release:
    name: iOS App Store Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Codemagic  # must match the name in Codemagic UI → Teams → Integrations
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: fyi.boomerang.app
      vars:
        BUNDLE_ID: "fyi.boomerang.app"
        XCODE_SCHEME: "App"
      node: 22
    scripts:
      - name: Install client dependencies
        script: |
          cd client
          npm install

      - name: Build web app
        script: |
          cd client
          npm run build

      - name: Sync Capacitor
        script: |
          cd client
          npx cap sync ios

      - name: Increment build number
        script: |
          cd client/ios/App
          agvtool new-version -all $PROJECT_BUILD_NUMBER

      - name: Build and export IPA
        script: |
          set -e
          cd client/ios/App
          xcode-project build-ipa \
            --project App.xcodeproj \
            --scheme "$XCODE_SCHEME"

      - name: Upload to App Store Connect
        script: |
          IPA_PATH=$(find "$CM_BUILD_DIR" -name "*.ipa" -type f 2>/dev/null | head -1)
          echo "Found IPA: $IPA_PATH"
          if [ -n "$IPA_PATH" ]; then
            app-store-connect publish --path "$IPA_PATH"
          else
            echo "No IPA found!"
            exit 1
          fi

    artifacts:
      - "**/*.ipa"
