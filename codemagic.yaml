workflows:
  ios-release:
    name: iOS App Store Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Codemagic
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: fyi.boomerang.app
      vars:
        BUNDLE_ID: "fyi.boomerang.app"
        XCODE_SCHEME: "App"
        CM_CERTIFICATE: Boomerang_AppStore
        CM_PROVISIONING_PROFILE: Boomerang_AppStore_v2
      node: 22
    scripts:
      - name: Install client dependencies
        script: |
          cd client
          npm install

      - name: Build web app
        script: |
          cd client
          npm run build

      - name: Sync Capacitor
        script: |
          cd client
          npx cap sync ios

      - name: Set up code signing
        script: |
          # Install certificate from Codemagic code signing identities
          keychain initialize
          keychain add-certificates --certificate "$CM_CERTIFICATE"

          # Install provisioning profile
          PROFILES_HOME="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES_HOME"
          PROFILE_PATH=$(find "$HOME/Library/Caches/us.abstracta.codemagic" -name "*.mobileprovision" 2>/dev/null | head -1)
          if [ -z "$PROFILE_PATH" ]; then
            echo "Fetching profile via API..."
            app-store-connect fetch-signing-files "$BUNDLE_ID" \
              --type IOS_APP_STORE \
              --create
          fi
          xcode-project use-profiles --project client/ios/App/App.xcodeproj

      - name: Increment build number
        script: |
          cd client/ios/App
          agvtool new-version -all $PROJECT_BUILD_NUMBER

      - name: Build and export IPA
        script: |
          set -e
          cd client/ios/App
          xcode-project build-ipa \
            --project App.xcodeproj \
            --scheme "$XCODE_SCHEME"

      - name: Upload to App Store Connect
        script: |
          IPA_PATH=$(find "$CM_BUILD_DIR" -name "*.ipa" -type f 2>/dev/null | head -1)
          echo "Found IPA: $IPA_PATH"
          if [ -n "$IPA_PATH" ]; then
            app-store-connect publish --path "$IPA_PATH"
          else
            echo "No IPA found!"
            exit 1
          fi

    artifacts:
      - "**/*.ipa"
