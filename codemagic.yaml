workflows:
  ios-release:
    name: iOS App Store Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Codemagic
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: fyi.boomerang.app
      vars:
        BUNDLE_ID: "fyi.boomerang.app"
        XCODE_SCHEME: "App"
        CM_CERTIFICATE: Boomerang_AppStore
        CM_PROVISIONING_PROFILE: Boomerang_AppStore_v2
        PROJECT_BUILD_NUMBER: "12"
      node: 22
    scripts:
      - name: Install client dependencies
        script: |
          cd client
          npm install

      - name: Build web app
        script: |
          cd client
          npm run build

      - name: Sync Capacitor
        script: |
          cd client
          npx cap sync ios

      - name: Fix Xcode signing settings
        script: |
          # cap sync overwrites project.pbxproj — patch signing settings after sync
          PBXPROJ="client/ios/App/App.xcodeproj/project.pbxproj"

          # Switch ProvisioningStyle from Automatic to Manual
          sed -i '' 's/ProvisioningStyle = Automatic/ProvisioningStyle = Manual/g' "$PBXPROJ"

          # Switch CODE_SIGN_STYLE from Automatic to Manual in target configs
          sed -i '' 's/CODE_SIGN_STYLE = Automatic/CODE_SIGN_STYLE = Manual/g' "$PBXPROJ"

          # Add DEVELOPMENT_TEAM and CODE_SIGN_IDENTITY after ASSETCATALOG line in target configs
          # Use Python for reliable multi-line replacement
          python3 - <<'PYEOF'
          import re

          with open("client/ios/App/App.xcodeproj/project.pbxproj", "r") as f:
              content = f.read()

          # Add DEVELOPMENT_TEAM after CODE_SIGN_STYLE = Manual if not already present
          if "DEVELOPMENT_TEAM = FQ8GX7UR2S" not in content:
              content = content.replace(
                  "CODE_SIGN_STYLE = Manual;",
                  "CODE_SIGN_STYLE = Manual;\n\t\t\t\tDEVELOPMENT_TEAM = FQ8GX7UR2S;"
              )

          # Ensure CODE_SIGN_IDENTITY is Apple Distribution in target configs
          content = content.replace(
              'CODE_SIGN_IDENTITY = "iPhone Developer";',
              'CODE_SIGN_IDENTITY = "Apple Distribution";'
          )

          with open("client/ios/App/App.xcodeproj/project.pbxproj", "w") as f:
              f.write(content)

          print("Patched project.pbxproj signing settings")
          PYEOF

          echo "=== Signing settings after patch ==="
          grep -E "CODE_SIGN_STYLE|CODE_SIGN_IDENTITY|DEVELOPMENT_TEAM|ProvisioningStyle" "$PBXPROJ"

      - name: Set up code signing
        script: |
          # Initialize keychain and install the Codemagic-managed certificate
          keychain initialize
          # Install certificate by reference name stored in Codemagic Code Signing Identities
          CM_CERTIFICATE_PATH=$(find "$HOME/Library/Caches/us.abstracta.codemagic" -name "*.p12" 2>/dev/null | head -1)
          echo "Looking for certificate..."
          ls "$HOME/Library/Caches/us.abstracta.codemagic/" 2>/dev/null || true
          keychain add-certificates
          # Install provisioning profile
          PROFILES_HOME="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES_HOME"
          find "$HOME" -name "*.mobileprovision" 2>/dev/null | head -5
          # Use xcode-project to patch the Xcode project
          xcode-project use-profiles --project client/ios/App/App.xcodeproj --verbose
          echo "=== Signing identities in keychain ==="
          security find-identity -v -p codesigning

      - name: Increment build number
        script: |
          cd client/ios/App
          agvtool new-version -all $PROJECT_BUILD_NUMBER

      - name: Build and export IPA
        script: |
          cd client/ios/App
          # Run xcodebuild directly to see full error output
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -archivePath build/App.xcarchive \
            -destination "generic/platform=iOS" \
            -allowProvisioningUpdates \
            archive \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM=FQ8GX7UR2S \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            2>&1 || true

          # Export IPA from archive
          if [ -d "build/App.xcarchive" ]; then
            cat > /tmp/export_options.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>FQ8GX7UR2S</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>fyi.boomerang.app</key>
              <string>Boomerang_AppStore</string>
            </dict>
          </dict>
          </plist>
          EOF
            xcodebuild -exportArchive \
              -archivePath build/App.xcarchive \
              -exportPath build/ipa \
              -exportOptionsPlist /tmp/export_options.plist 2>&1
          else
            echo "Archive failed — no xcarchive produced"
            exit 1
          fi

      - name: Upload to App Store Connect
        script: |
          IPA_PATH=$(find "$CM_BUILD_DIR" build/ipa -name "*.ipa" -type f 2>/dev/null | head -1)
          echo "Found IPA: $IPA_PATH"
          if [ -n "$IPA_PATH" ]; then
            app-store-connect publish --path "$IPA_PATH"
          else
            echo "No IPA found!"
            exit 1
          fi

    artifacts:
      - "**/*.ipa"
