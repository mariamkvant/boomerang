name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    name: TypeScript check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            skillswap/package-lock.json
            skillswap/client/package-lock.json

      # ── Server ────────────────────────────────────────────────────────────
      - name: Install server dependencies
        run: npm ci
        working-directory: skillswap

      - name: TypeScript check — server
        run: npx tsc --noEmit
        working-directory: skillswap

      # ── Client ────────────────────────────────────────────────────────────
      - name: Install client dependencies
        run: npm ci
        working-directory: skillswap/client

      - name: TypeScript check — client
        run: npx tsc --noEmit
        working-directory: skillswap/client
