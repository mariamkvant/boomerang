name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            skillswap/package-lock.json
            skillswap/client/package-lock.json

      # ── Server ────────────────────────────────────────────────────────────
      - name: Install server dependencies
        run: npm ci
        working-directory: skillswap

      - name: TypeScript check — server
        run: npx tsc --noEmit
        working-directory: skillswap

      - name: Run server tests
        run: npm test
        working-directory: skillswap

      # ── Client ────────────────────────────────────────────────────────────
      - name: Install client dependencies
        run: npm ci
        working-directory: skillswap/client

      - name: TypeScript check — client
        run: npx tsc --noEmit
        working-directory: skillswap/client

      - name: Run client tests
        run: npm test
        working-directory: skillswap/client

      - name: Build client
        run: npm run build
        working-directory: skillswap/client

  # ── Deploy — only runs after all tests pass, only on main (not PRs) ──────
  deploy:
    name: Deploy to Railway
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Trigger Railway deployment
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.RAILWAY_TOKEN }}" \
            -H "Content-Type: application/json" \
            https://backboard.railway.app/graphql/v2 \
            --data '{"query":"mutation { deploymentTrigger(input: { projectId: \"${{ secrets.RAILWAY_PROJECT_ID }}\", environmentId: \"${{ secrets.RAILWAY_ENVIRONMENT_ID }}\" }) { id } }"}'
        continue-on-error: true
